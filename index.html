<!DOCTYPE html>

<title>MD Souad Nun</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
scroll-behavior:smooth;
}

body{
background:#000;
color:#fff;
}

.container{
width:90%;
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.profile{
text-align:center;
margin-top:20px;
}

.profile img{
width:180px;
height:180px;
border-radius:50%;
border:4px solid #fff;
object-fit:cover;
transition:.4s;
}

.profile img:hover{
transform:scale(1.05);
}

.profile h1{
margin-top:20px;
font-size:42px;
}

.about{
margin-top:15px;
color:#ccc;
font-size:18px;
line-height:30px;
max-width:700px;
margin-left:auto;
margin-right:auto;
}

.links{
margin-top:40px;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:15px;
}

.links a{
text-decoration:none;
background:#111;
color:#fff;
padding:18px;
border:2px solid #fff;
border-radius:12px;
font-size:18px;
transition:.3s;
}

.links a:hover{
background:#fff;
color:#000;
}

.gallery{
margin-top:70px;
}

.gallery h2{
text-align:center;
font-size:34px;
margin-bottom:25px;
}

.images{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.images img{
width:100%;
height:320px;
object-fit:cover;
border-radius:15px;
border:2px solid #fff;
transition:.3s;
}

.images img:hover{
transform:scale(1.03);
}

footer{
margin-top:60px;
padding:20px;
border-top:1px solid #444;
text-align:center;
color:#aaa;
}

@media(max-width:700px){

.profile img{
width:150px;
height:150px;
}

.profile h1{
font-size:32px;
}

.about{
font-size:16px;
}

}

</style>
</head>
